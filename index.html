
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Bird</title>
<style>
body {
  margin: 0;
  background: #202b38;
  color: white;
  font-family: monospace;
  text-align: center;
}
canvas {
  width: min(94vw, 360px, 75vh);
  height: auto;
  border: 4px solid #18232c;
  touch-action: none;
}
</style>
</head>
<body>
<h2>🐦 PIXEL BIRD</h2>
<canvas id="game" width="360" height="640"></canvas>
<p>Kattints vagy nyomj szóközt a repüléshez!</p>
<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
const W = 360, H = 640, ground = 570;
let birdY = 300, velocity = 0;
let pipes = [], score = 0, best = 0;
let started = false, dead = false, timer = 0;
try {
  best = Number(localStorage.getItem("pixelBirdBest")) || 0;
} catch(e) {}

function reset() {
  birdY = 300; velocity = 0;
  pipes = [makePipe(270), makePipe(470)];
  score = 0; timer = 0;
  started = false; dead = false;
}
function makePipe(x) {
  return {x, y: 190 + Math.random()*220, scored:false};
}
function flap() {
  if (dead) reset();
  started = true;
  velocity = -310;
}
c.addEventListener("pointerdown", e => {
  e.preventDefault(); flap();
});
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault(); flap();
  }
});
function endGame() {
  dead = true;
  if (score > best) {
    best = score;
    try { localStorage.setItem("pixelBirdBest", best); } catch(e) {}
  }
}
function hit(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}
function update(dt) {
  if (!started || dead) return;
  velocity += 900*dt;
  birdY += velocity*dt;
  timer += dt;
  if (timer > 1.45) {
    timer = 0; pipes.push(makePipe(380));
  }
  const bird = {x:73,y:birdY-12,w:24,h:24};
  for (const p of pipes) {
    p.x -= 150*dt;
    const top = {x:p.x,y:0,w:58,h:p.y-82.5};
    const bottom = {x:p.x,y:p.y+82.5,w:58,h:570-(p.y+82.5)};
    if (hit(bird,top)||hit(bird,bottom)) endGame();
    if (!p.scored && p.x+58<85) {
      p.scored=true; score++;
    }
  }
  pipes = pipes.filter(p=>p.x>-60);
  if (birdY-12<0 || birdY+12>=ground) endGame();
}
function rect(x,y,w,h,color) {
  ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
}
function draw() {
  rect(0,0,W,H,"#70c5ce");
  rect(30,95,42,12,"white"); rect(42,84,25,16,"white");
  rect(220,145,50,12,"white"); rect(235,134,25,16,"white");
  rect(0,480,W,90,"#a8dc70");
  rect(0,515,W,55,"#78c850");
  for (const p of pipes) {
    rect(p.x,0,58,p.y-82.5,"#43b047");
    rect(p.x-5,p.y-100.5,68,18,"#238b36");
    rect(p.x,p.y+82.5,58,570-(p.y+82.5),"#43b047");
    rect(p.x-5,p.y+82.5,68,18,"#238b36");
    rect(p.x+8,0,8,p.y-100.5,"#83df69");
  }
  rect(0,570,W,12,"#ded895");
  rect(0,582,W,58,"#d6a84b");
  for(let x=0;x<W;x+=24) rect(x,590,12,4,"#b98937");
  rect(73,birdY-9,22,19,"#f8d448");
  rect(78,birdY-13,15,5,"#ffe45c");
  rect(92,birdY-7,10,7,"#f28c28");
  rect(89,birdY-11,7,7,"white");
  rect(92,birdY-9,3,4,"#202020");
  ctx.textAlign="center";
  ctx.font="bold 36px monospace";
  ctx.fillStyle="white";
  ctx.fillText(score,180,65);
  if (!started && !dead) {
    rect(35,230,290,115,"#267d8b");
    ctx.font="bold 22px monospace";
    ctx.fillText("PIXEL BIRD",180,270);
    ctx.font="13px monospace";
    ctx.fillText("KATTINTS A KEZDESHEZ",180,305);
  }
  if (dead) {
    rect(30,220,300,165,"#24444b");
    ctx.fillStyle="#ffe45c";
    ctx.font="bold 21px monospace";
    ctx.fillText("VEGE A JATEKNAK",180,265);
    ctx.fillStyle="white";
    ctx.font="15px monospace";
    ctx.fillText("Pont: "+score,180,305);
    ctx.fillText("Rekord: "+best,180,330);
    ctx.font="12px monospace";
    ctx.fillText("KOPPINTS AZ UJRAKEZDESHEZ",180,357);
  }
}
let last = 0;
function loop(t) {
  const dt = last ? Math.min((t-last)/1000,0.033) : 0;
  last=t; update(dt); draw();
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
